[package]
name = "local-3d-viewer"
version = "0.1.0"
description = "Offline 3D model viewer"
authors = ["muhammadli3d"]
license = "MIT"
repository = "https://github.com/muhammadli3d/3d-quick-viewer"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "local_3d_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0" }
tauri-plugin-log = "2"
